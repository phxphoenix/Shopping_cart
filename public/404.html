<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Retro Shopping Cart v2.0 - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages redirect handler
      const pathSegmentsToKeep = 1; // '/Shopping_cart/' has 1 segment
      const l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body style="background-color: #0b0f0b; color: #21f35a; font-family: monospace; padding: 2rem">
    <p>[SYSTEM: 404 NOT FOUND - REDIRECTING TO TERMINAL BASE...]</p>
  </body>
</html>
